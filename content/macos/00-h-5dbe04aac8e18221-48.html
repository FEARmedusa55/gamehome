     Paste into: Insert -&gt; Embed -&gt; Embed code

     SETUP: change PAGE_ID below to a unique name for THIS page.
     Use a different PAGE_ID on every page, e.g.
       section-home-new, section-android-new, section-downloads-new
     Keep them distinctive - these names are global to the counting service. --&gt;
&lt;style&gt;
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  /* Invisible stage: fills the embed box, centers the drawn button. */
  #stage {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    pointer-events: none;   /* no hitbox: clicks pass straight through */
  }

  /* The drawn button: sized by its own padding + text. */
  #button {
    display: inline-flex;
    align-items: center;
    background: #111;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(12px, 4vw, 16px);
    font-weight: bold;
    white-space: nowrap;
    padding: 10px 22px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    max-width: 100%;
    user-select: none;
  }
&lt;/style&gt;

&lt;div id=&quot;stage&quot;&gt;
  &lt;div id=&quot;button&quot;&gt;Visitor count:&amp;nbsp;&lt;span id=&quot;count&quot;&gt;…&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
  // ── Settings: change this per page ───────────────────────
  var PAGE_ID = &quot;section-macos-new&quot;;
  // ─────────────────────────────────────────────────────────

  // Fixed key - identical in every browser, so Firefox and Chromium
  // always increment the same counter. (Previously this was detected
  // from document.referrer, which differs per browser inside a
  // Google Sites embed and split the count in two.)
  var KEY = &quot;views&quot;;

  fetch(&quot;https://abacus.jasoncameron.dev/hit/&quot; + encodeURIComponent(PAGE_ID) + &quot;/&quot; + KEY)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById(&quot;count&quot;).textContent = data.value;
    })
    .catch(function () {
      document.getElementById(&quot;count&quot;).textContent = &quot;unavailable&quot;;
    });
&lt;/script&gt;

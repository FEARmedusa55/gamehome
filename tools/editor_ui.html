<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site editor</title>
<style>
  :root {
    --bg:#0f1216; --panel:#171c22; --panel-2:#1f262e; --border:#272e37; --border-2:#38424e;
    --text:#e4e9f0; --muted:#8d99a6; --accent:#4d8dff; --accent-soft:#16233a;
    --danger:#e2685a; --ok:#43b581; --warn:#d9a343;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;
       /* a column so the panes take exactly the space left under the header and
          the bar, whatever height those are — a hard-coded calc drifts */
       height:100vh;display:flex;flex-direction:column;overflow:hidden}

  header{
    display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;
  }
  header .brand{font-weight:700;letter-spacing:-.01em}
  header .brand span{color:var(--accent)}
  header .spacer{flex:1}
  header .status{color:var(--muted);font-size:12.5px;min-height:16px}

  button{
    font:inherit;padding:5px 11px;border:1px solid var(--border-2);background:var(--panel);
    color:var(--text);border-radius:6px;cursor:pointer;
  }
  button:hover{background:var(--panel-2)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#08111f}
  button.primary:hover{filter:brightness(1.12)}

  /* --- publish panel --- */
  .pubpanel{position:fixed;top:56px;right:16px;width:380px;max-width:calc(100vw - 32px);
    background:var(--panel);border:1px solid var(--border-2);border-radius:10px;
    box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:50;padding:14px 16px;font-size:13.5px;line-height:1.5}
  .pubpanel[hidden]{display:none}
  .pubhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .pubpanel p{margin:0 0 10px}
  .pubpanel .muted{color:var(--muted)}
  .pubpanel .warnbox{background:rgba(217,163,67,.12);border:1px solid rgba(217,163,67,.4);
    border-radius:6px;padding:8px 10px;margin:0 0 10px}
  .pubpanel ul{margin:0 0 10px;padding-left:18px}
  .pubpanel input, .pubpanel textarea{width:100%;box-sizing:border-box;margin:0 0 10px}
  .pubpanel textarea{min-height:0;font-size:13.5px;line-height:1.45;resize:vertical}
  .pubpanel .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .pubpanel .result{border-radius:6px;padding:8px 10px;margin-top:6px}
  .pubpanel .result.good{background:rgba(67,181,129,.14);border:1px solid rgba(67,181,129,.45)}
  .pubpanel .result.bad{background:rgba(226,104,90,.14);border:1px solid rgba(226,104,90,.5)}
  .pubpanel a{color:var(--accent)}
  button.tiny{padding:2px 7px;font-size:12px;line-height:1.4}
  button.danger:hover{color:var(--danger);border-color:var(--danger)}
  button:disabled{opacity:.45;cursor:default}

  /* The first column is 250px on purpose: that is the width of the site's own
     nav sidebar (.JzO0Vc{width:250px}). Matching it means an element's position
     in the preview lines up with its position beside the editor's own sidebar,
     which is what makes dragged objects translate. Do not "tidy" this number. */
  .layout{display:grid;grid-template-columns:250px 1fr;flex:1;min-height:0}
  .layout > *{min-height:0}

  /* full screen: preview only, filling the window */
  body.fs .sitebar{display:none}
  body.fs .layout{grid-template-columns:1fr}
  body.fs aside{display:none}
  body.fs .preview{border-left:0}

  /* the pane itself, once the Fullscreen API has taken over */
  .preview:fullscreen{border-left:0}
  .preview:fullscreen .bar{background:var(--panel)}

  /* --- sidebar --- */
  aside{background:var(--panel);border-right:1px solid var(--border);overflow:auto;padding:12px 0}
  aside h3{
    margin:0;padding:6px 16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);font-weight:700;
  }
  aside ul{list-style:none;margin:0 0 10px;padding:0}
  /* One tree instead of separate Categories and Pages lists: the same page
     used to appear in both, and the sub-pages had no home at all. */
  aside .row{display:flex;align-items:center;gap:3px;padding:0 10px 0 6px}
  aside .row:hover{background:var(--bg)}
  aside .row a{
    flex:1;min-width:0;display:block;padding:5px 8px;border-radius:6px;color:var(--text);
    text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  aside .row a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  aside .row .grip{
    flex:none;width:13px;text-align:center;color:var(--muted);cursor:pointer;
    font-size:9px;-webkit-user-select:none;user-select:none;
  }
  aside .row .grip:hover{color:var(--text)}
  aside .row .tools{display:none;gap:2px;flex:none}
  aside .row:hover .tools{display:flex}
  aside .kids{display:none;margin-left:14px;border-left:1px solid var(--border);padding-left:2px}
  aside li.open>.kids{display:block}
  aside .row a.nopage{color:var(--muted);font-style:italic;cursor:default}
  .catrow{display:flex;align-items:center;gap:6px;padding:2px 12px 2px 16px}
  .catrow .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .addcat{display:flex;gap:6px;padding:6px 16px 2px}
  .addcat input{flex:1;min-width:0}
  input[type=text],textarea{
    font:inherit;padding:5px 8px;border:1px solid var(--border-2);border-radius:6px;
    background:#0b0e12;color:var(--text);width:100%;
  }
  input[type=text]:focus,textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);
  }
  input::placeholder{color:#5d6774}
  textarea{resize:vertical;min-height:96px;line-height:1.6;font-size:14px}
  .run textarea{min-height:96px}

  /* --- editor --- */
  main{overflow:auto;padding:16px 20px 80px}
  .pagehead{margin:0 0 4px;font-size:18px;font-weight:700}
  .pagehead small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}

  .sec{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    margin:14px 0;overflow:hidden;
  }
  .sec.dirty{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .sec header{
    position:static;background:var(--panel);border-bottom:1px solid var(--border);
    padding:8px 12px;gap:8px;
  }
  .sec .idx{
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
    background:var(--bg);padding:2px 6px;border-radius:4px;
  }
  .sec .prev{flex:1;color:var(--muted);font-size:12.5px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .sec .body{padding:12px}
  .run{margin-bottom:12px}
  .run:last-child{margin-bottom:0}
  .runbar{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .runmeta{font-size:11px;color:var(--muted);font-family:var(--mono);flex:1}
  .swatch{
    width:26px;height:22px;padding:0;border:1px solid var(--border-2);
    border-radius:5px;background:transparent;cursor:pointer;
  }
  .runbar button.on{background:var(--accent);border-color:var(--accent);color:#08111f}

  /* One toolbar per section. It styles whichever text box you were last in,
     applying to your selection when there is one — so colour and bold no
     longer need a control per run, or a whole new box. */
  .tb{
    display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px;
    padding:8px 10px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:8px;position:sticky;top:0;z-index:5;
  }
  .tb .tblabel{font-size:11px;color:var(--muted);font-family:var(--mono);margin-right:2px}
  .tb .tbhint{font-size:11px;color:var(--muted);margin-left:auto}
  .tb .tbsep{width:1px;height:20px;background:var(--border-2);margin:0 2px}
  .tb .pal{
    width:22px;height:22px;padding:0;border:1px solid var(--border-2);
    border-radius:5px;cursor:pointer;
  }
  .tb .pal:hover{border-color:var(--accent)}
  .tb button.tiny{min-width:26px}
  .tb button.on{background:var(--accent);border-color:var(--accent);color:#08111f}
  .tb select{
    background:#0b0e12;color:var(--text);border:1px solid var(--border-2);
    border-radius:5px;padding:3px 6px;font-size:12px;
  }
  .tb .focusnote{font-size:11px;color:var(--warn)}
  .tb input.linkurl{
    width:130px;background:#0b0e12;color:var(--text);
    border:1px solid var(--border-2);border-radius:5px;
    padding:3px 6px;font-size:12px;
  }
  .tb input.linkurl:focus{border-color:var(--accent);outline:none}
  .blockbox a{color:inherit}
  .blockbox a[href]{text-decoration:underline}

  /* the default image a new Image element starts with */
  .defimg{padding:10px 16px 14px;border-top:1px solid var(--border);margin-top:10px}
  .defimg h3{margin:0 0 8px;padding:0;font-size:11px;letter-spacing:.08em;
             text-transform:uppercase;color:var(--muted);font-weight:700}
  .defthumb{display:block;width:100%;max-height:110px;object-fit:contain;
            background:#0b0e12;border:1px solid var(--border-2);border-radius:6px;
            margin-bottom:8px}
  .defhint{margin:8px 0 0;font-size:11px;color:var(--muted);line-height:1.45}

  /* A stale tab is the failure that has bitten repeatedly: the browser keeps an
     old copy of this page, its preview is requested without the edit flag, and
     nothing looks wrong. The stamp makes that visible. */
  .build{font-family:var(--mono);font-size:10px;color:var(--muted);
         font-weight:400;margin-left:6px;letter-spacing:.04em}

  /* Loud, because a preview that silently is not editable is the whole problem */
  .warnbar{
    background:#5a1f1a;border-bottom:1px solid #8c3a30;color:#ffd9d3;
    font-size:12.5px;padding:8px 14px;line-height:1.5;
  }
  .warnbar b{color:#fff}

  /* the editor's own top bar: the styling controls live here, not per section */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:var(--panel);border-bottom:1px solid var(--border);
    padding:6px 14px;
  }
  .topbar .tb{margin:0;flex-wrap:wrap;row-gap:6px}

  /* the button list: label, link, colour, size, order */
  .btnpanel{
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;
    margin-bottom:12px;background:var(--panel-2);
  }
  .btnrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .btnrow:last-of-type{margin-bottom:8px}
  .btnrow input.btlabel{
    flex:0 0 190px;background:#0b0e12;color:var(--text);border:1px solid var(--border-2);
    border-radius:5px;padding:4px 7px;font-size:12.5px;
  }
  .btnrow input.bthref{
    flex:1 1 auto;min-width:120px;background:#0b0e12;color:var(--muted);
    border:1px solid var(--border-2);border-radius:5px;padding:4px 7px;font-size:12px;
  }
  .btnrow input.btlabel:focus,.btnrow input.bthref:focus{border-color:var(--accent);outline:none}
  .btnrow select.btsize{
    background:#0b0e12;color:var(--text);border:1px solid var(--border-2);
    border-radius:5px;padding:3px 5px;font-size:12px;
  }

  /* One editable box per paragraph. Styling shows here as you set it, so you
     can see what is building what while you write. */
  .blockbox{
    min-height:34px;padding:8px 10px;background:#0b0e12;
    border:1px solid var(--border-2);border-radius:6px;
    font-family:inherit;font-size:14px;line-height:1.55;
    outline:none;white-space:pre-wrap;word-break:break-word;
  }
  .blockbox:focus{border-color:var(--accent);background:#0d1117}
  .blockbox:empty:before{content:'(empty)';color:var(--muted)}

  /* add-element menu */
  .elmenu{
    position:absolute;top:100%;left:0;margin-top:5px;z-index:30;
    background:var(--panel);border:1px solid var(--border-2);border-radius:8px;
    padding:4px;min-width:190px;display:flex;flex-direction:column;gap:2px;
    box-shadow:0 10px 28px rgba(0,0,0,.5);
  }
  /* Without this the class's display:flex beats the UA's [hidden]{display:none},
     so setting the hidden attribute did nothing and the menu never closed. */
  .elmenu[hidden]{display:none}
  .elmenu button{
    text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;
  }
  .elmenu button:hover{background:var(--panel-2)}

  /* images inside a section */
  .imgbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .imgcell{
    display:flex;flex-direction:column;gap:5px;align-items:flex-start;
    border:1px solid var(--border);border-radius:8px;padding:7px;background:var(--panel-2);
  }
  .imgcell img{
    max-width:190px;max-height:120px;border-radius:5px;display:block;
    background:#0b0e12;object-fit:contain;
  }
  .imgcell .imgsrc{font-size:10px;color:var(--muted);font-family:var(--mono);
    max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--muted);font-style:italic}

  /* --- preview --- */
  .preview{border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column}
  .preview .bar{
    display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);
    font-size:12.5px;color:var(--muted);
  }
  .preview iframe{flex:1;width:100%;border:0;background:var(--bg)}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:#05070a;border:1px solid var(--border-2);color:#fff;
    padding:9px 16px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .18s;
  }
  .toast.show{opacity:1}
  .toast.err{background:#2a1210;border-color:var(--danger)}
</style>
</head>
<body>

<header class="sitebar">
  <div class="brand"><span>&#9632;</span> Site editor <b id="build" class="build"></b></div>
  <div class="status" id="status"></div>
  <div class="spacer"></div>
  <button id="undo">Undo</button>
  <button id="fullscreen">Full screen</button>
  <button id="openSite">Open site</button>
  <button id="publish" class="primary" title="Upload your changes to GitHub">Publish</button>
</header>

<!-- Publish: the git steps, done for you. See tools/publish.py. -->
<div class="pubpanel" id="pubPanel" hidden>
  <div class="pubhead"><b>Publish to GitHub</b><button class="tiny" id="pubClose" title="Close">&#10005;</button></div>
  <div id="pubBody"></div>
</div>

<!-- The styling bar: one for the whole editor, like a word processor's, acting
     on whichever paragraph you are in and the words you have selected there. -->
<div class="topbar" id="topbar"></div>

<!-- Shown only when the preview is not editable. The failure is otherwise
     invisible: the page looks normal and simply does not respond. -->
<div class="warnbar" id="warnbar" hidden></div>

<div class="layout" id="layout">
  <aside>
    <h3>Site</h3>
    <ul id="tree"></ul>
    <div class="addcat">
      <input type="text" id="newPage" placeholder="New page name" />
      <button class="tiny" id="addPage" title="Create a page and add it to the nav">+ page</button>
    </div>
    <div class="addcat">
      <input type="text" id="newGroup" placeholder="New group name" />
      <button class="tiny" id="addGroup" title="Add a nav heading with no page behind it">+ group</button>
    </div>

    <div class="defimg">
      <h3>Default image</h3>
      <img id="defThumb" class="defthumb" alt="the picture new Image elements start with" />
      <input type="file" id="defFile" accept="image/*" hidden />
      <button class="tiny" id="defPick"
              title="Choose the picture new Image elements start with">Choose image&hellip;</button>
      <p class="defhint">New Image and Image + text elements start with this one.</p>
    </div>
  </aside>

  <section class="preview" id="previewPane">
    <div class="bar">
      <span id="previewName">preview</span>
      <span class="spacer" style="flex:1"></span>
      <button class="tiny" id="reloadPreview">Reload</button>
    </div>
    <iframe id="preview" src="about:blank"></iframe>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
let STATE = { pages: [], categories: [] };
let CURRENT = null;

async function get(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function post(payload) {
  const r = await fetch('/api/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const j = await r.json();
  if (typeof j.undoDepth === 'number') setUndo(j.undoDepth);
  if (j.ok && !String(payload.action || '').startsWith('git_') && payload.action !== 'publish') {
    clearTimeout(post._pub);
    post._pub = setTimeout(() => { if (typeof pubRefresh === 'function') pubRefresh(); }, 800);
  }
  if (!j.ok) throw new Error(j.error || 'action failed');
  return j;
}

function setUndo(depth) {
  const undoBtn = document.getElementById('undo');
  if (!undoBtn) return;
  undoBtn.disabled = !depth;
  undoBtn.title = depth
    ? `${depth} step${depth === 1 ? '' : 's'} available`
    : 'Nothing to undo yet';
}

function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast'; }, 2600);
}
function status(msg) { document.getElementById('status').textContent = msg || ''; }

// The preview is served with data-mmb markers so a click can be traced to a
// section and block. Verified: all 52 blocks of the front page are marked, each
// marker's text matches the card it claims to be, and typing in the preview
// saves only to that block. See preview_edit.py.
const PREVIEW_EDIT = true;

let previewWait = null;
// Declared, not left implicit: reading an undeclared identifier throws even in
// non-strict mode, so `clearInterval(previewKeep)` at the top of
// armPreviewScript killed the watcher before it could start.
let previewKeep = null;

// Shown in the header. If this does not change when you reload, your browser is
// serving an old copy of this page — the failure that has bitten repeatedly
// here, because a stale tab asks for the preview without the edit flag and
// nothing about it looks wrong.
const BUILD = '2026-10-06r';
(function stamp() {
  const mount = () => {
    const b = document.getElementById('build');
    if (b) b.textContent = BUILD;
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();

// A preview that is not editable looks exactly like one that is. Say so loudly.
function warn(html) {
  const w = document.getElementById('warnbar');
  if (!w) return;
  w.hidden = !html;
  w.innerHTML = html || '';
}

// The page's own scripts can replace the document after it loads, which wipes
// anything injected into its markup. That is what happens here in Firefox: the
// site's bundle throws (_._DumpException is not a function) and the page
// re-renders, so the markers show for a frame and then vanish.
//
// This frame's JavaScript does demonstrably run, so it fetches the marker style
// and script and puts them into the frame itself, then keeps checking and puts
// them back if the page replaces itself again.
function armPreviewScript() {
  const f = document.getElementById('preview');
  clearInterval(previewKeep);

  // The watcher's own state, written onto the preview element as data attributes.
  // Reading the editor's globals is not possible from outside the page's script
  // world, so this is how the watcher reports in. data-mmstate says what it did
  // last; data-mmwatch counts its ticks.
  let ticks = 0;
  let lastCount = 0;
  const inject = () => {
    ticks += 1;
    f.dataset.mmwatch = String(ticks);
    try {
      let d = null;
      try { d = f.contentDocument; } catch (e) { f.dataset.mmstate = 'no-access'; return; }
      if (!d || !d.body) { f.dataset.mmstate = 'not-ready'; return; }

      const live = d.querySelectorAll('[data-mmb]').length;
      if (live > lastCount) lastCount = live;

      if (d.getElementById('mm-dbg') || d.getElementById('mm-edit-live')) {
        // The markers are there, but the page may have re-rendered some of its
        // own sections and taken those markers with the replaced nodes — the
        // readout survives that, so counting is what actually detects it.
        // Original sections are in the page's model and get re-rendered; added
        // ones are not and survive. That is why made elements kept working and
        // original ones did not.
        if (d.querySelector('[data-mm-list="dirty"]')) {
          // Joining bullets removes markers on purpose; that is not the page
          // re-rendering itself, so there is nothing to put back.
          f.dataset.mmstate = 'editing a list';
        } else if (lastCount && live < lastCount && d.defaultView && d.defaultView.__mmRetag) {
          try {
            d.defaultView.__mmRetag();
            const after = d.querySelectorAll('[data-mmb]').length;
            f.dataset.mmstate = 'retagged ' + live + '->' + after;
            if (after > lastCount) lastCount = after;
          } catch (e) {
            f.dataset.mmstate = 'retag-failed: ' + e;
          }
        } else {
          f.dataset.mmstate = 'ok (' + live + '/' + lastCount + ')';
        }
        return;
      }

      f.dataset.mmstate = 'fetching';
      fetch('mm-edit.js?file=' + encodeURIComponent(CURRENT))
        .then(r => r.json())
        .then(parts => {
          if (!parts || !parts.script) { f.dataset.mmstate = 'empty-response'; return; }
          const d2 = f.contentDocument;
          if (!d2 || !d2.body) { f.dataset.mmstate = 'no-doc-late'; return; }
          if (d2.getElementById('mm-dbg') || d2.getElementById('mm-edit-live')) {
            f.dataset.mmstate = 'already-ok-late';
            return;
          }
          const st = d2.createElement('style');
          st.id = 'mm-edit-live-style';
          st.textContent = parts.style || '';
          (d2.head || d2.documentElement).appendChild(st);
          const sc = d2.createElement('script');
          sc.id = 'mm-edit-live';
          sc.textContent = parts.script;
          d2.body.appendChild(sc);
          f.dataset.mmstate = 'injected';
          console.log('[editor] injected the marker script into the preview frame');
        })
        .catch(err => {
          f.dataset.mmstate = 'fetch-failed: ' + err;
          console.warn('[editor] mm-edit.js failed:', err);
        });
    } catch (e) {
      f.dataset.mmstate = 'threw: ' + e;
    }
  };

  // Keep watching for the whole session, not just a few seconds: the page could
  // replace itself at any point, and this is what puts the markers back when it
  // does. inject() returns immediately when the markers are already there, so
  // this is cheap. The next reload clears it.
  previewKeep = setInterval(inject, 500);
}

function reloadPreview() {
  // A list changed in the page but not saved yet would be thrown away by the
  // reload: save it first, then reload.
  if (dirtyLists().length) {
    flushLists().then(() => reloadPreview());
    return;
  }
  const f = document.getElementById('preview');
  // Refresh the page data the preview's clicks are resolved against, so it
  // always matches the markers the reloaded page is about to carry. Left as it
  // was, a button list edited a moment ago was sent back in its old form.
  if (CURRENT) {
    const file = CURRENT;
    get('/api/page?file=' + encodeURIComponent(file))
      .then(d => { if (CURRENT === file) CURRENT_DATA = d; })
      .catch(() => {});
  }
  f.src = 'about:blank';
  // If the page never reports in, say so rather than leaving a preview that
  // looks fine and silently is not editable.
  clearTimeout(previewWait);
  previewWait = setTimeout(() => {
    let query = '';
    try { query = f.contentWindow.location.search || ''; } catch (e) { query = '(unreadable)'; }
    if (!query.includes('mm_edit')) {
      warn('The preview was requested <b>without the edit flag</b>. That means this browser '
           + 'tab is running an old copy of the editor — reload with <b>Ctrl+Shift+R</b>.');
    } else {
      warn('The preview was requested in edit mode but <b>the page never reported in</b>. '
           + 'Something in this browser is blocking the script.');
    }
  }, 7000);
  setTimeout(() => {
    f.src = CURRENT + (PREVIEW_EDIT ? '?mm_edit=1&' : '?') + 't=' + Date.now();
    // And put the markers in ourselves, in case the page's own scripts replace
    // the document after load and take the served copy with them.
    if (PREVIEW_EDIT) armPreviewScript();
  }, 40);
}

// If the preview navigates away — a stray link, or something the site's own
// scripts do — the flagged page is gone and the preview quietly stops being
// editable. Nothing looks broken, which is what makes it confusing. Notice and
// put it back.
(function guardPreview() {
  // Rate limited, and capped. The point is to recover from a one-off stray
  // navigation, not to fight a page that keeps doing it: an unthrottled reload
  // here is a reload loop, which is far worse than a dead preview.
  let last = 0;
  let autoReloads = 0;

  const mount = () => {
    const f = document.getElementById('preview');
    if (!f) return;
    f.addEventListener('load', () => {
      if (!PREVIEW_EDIT) return;
      let href = '';
      try { href = f.contentWindow.location.href || ''; } catch (e) { return; }
      if (!href || href === 'about:blank') return;      // our own blanking
      if (href.includes('mm_edit')) { autoReloads = 0; return; }   // good load

      const now = Date.now();
      if (now - last < 5000) return;                    // never loop
      if (autoReloads >= 3) return;                     // stop trying
      last = now;
      autoReloads++;
      toast('The preview navigated away \u2014 putting it back');
      reloadPreview();
    });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();

// Which groups are open in the sidebar tree. Remembered for the session so a
// re-render does not collapse everything the user opened.
const TREE_OPEN = new Set();
try {
  (JSON.parse(sessionStorage.getItem('treeOpen') || '[]') || []).forEach(k => TREE_OPEN.add(k));
} catch (e) {}
function saveTreeOpen() {
  try { sessionStorage.setItem('treeOpen', JSON.stringify([...TREE_OPEN])); } catch (e) {}
}

function tinyBtn(label, title, fn, disabled) {
  const b = document.createElement('button');
  b.className = 'tiny';
  b.textContent = label;
  b.title = title;
  if (disabled) b.disabled = true;
  else b.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); fn(); };
  return b;
}

function treeRow(opts) {
  const row = document.createElement('div');
  row.className = 'row';

  const grip = document.createElement('span');
  grip.className = 'grip';
  if (opts.grip) {
    grip.textContent = opts.open ? '\u25be' : '\u25b8';
    grip.title = opts.open ? 'Collapse' : 'Expand';
    grip.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); opts.onToggle(); };
  }
  row.appendChild(grip);

  const a = document.createElement('a');
  a.href = '#';
  a.textContent = opts.label;
  if (opts.file) {
    a.dataset.file = opts.file;
    a.onclick = (ev) => { ev.preventDefault(); selectPage(opts.file); };
  } else {
    a.className = 'nopage';
    a.title = 'Group heading \u2014 no page of its own';
    a.onclick = (ev) => ev.preventDefault();
  }
  row.appendChild(a);

  if (opts.tools && opts.tools.length) {
    const tools = document.createElement('span');
    tools.className = 'tools';
    opts.tools.forEach(t => tools.appendChild(t));
    row.appendChild(tools);
  }
  return row;
}

function removeCategory(row) {
  const msg = row.nopage
    ? `Remove the "${row.label}" group heading?`
    : `Remove the "${row.label}" category?\n\nThe page moves to _trash and the nav link is removed from every page.`;
  if (!confirm(msg)) return;
  post({ action: 'remove_category', slug: row.slug.replace(/^\//, '') })
    .then(() => { toast('Removed ' + row.label); return loadState(); })
    .catch(e => toast(e.message, true));
}

function addPageUnder(row) {
  const name = prompt(`New page under "${row.label}".\n\nIt will be named ${row.label} + your name, and nest under ${row.label}.`);
  if (!name || !name.trim()) return;
  const label = name.trim();
  const slug = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  if (!slug) return;
  post({ action: 'add_page', slug: slug, label: label, parent: row.slug })
    .then(r => {
      toast(`Added ${row.label} + ${label}`);
      return loadState().then(() => selectPage(r.page));
    })
    .catch(e => toast(e.message, true));
}

function moveChild(parent, child, dir) {
  post({ action: 'move_child', parent: parent.slug, slug: child.slug, dir: dir })
    .then(() => { toast('Moved ' + child.label); return loadState(); })
    .catch(e => toast(e.message, true));
}

function renameCategory(row) {
  const next = prompt(`Rename "${row.label}" to:`, row.label);
  if (!next || !next.trim() || next.trim() === row.label) return;
  post({ action: 'rename_category', slug: row.slug.replace(/^\//, ''), label: next.trim() })
    .then(() => { toast('Renamed to ' + next.trim()); return loadState(); })
    .catch(e => toast(e.message, true));
}

function renderTree() {
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  const rows = STATE.tree || [];

  rows.forEach((r, i) => {
    const children = r.children || [];
    const open = TREE_OPEN.has(r.slug);
    const li = document.createElement('li');
    if (children.length && open) li.classList.add('open');

    const tools = [
      tinyBtn('+', r.nopage ? 'Add a page under ' + r.label
                            : `Add a page under ${r.label} (named ${r.label} + your name)`,
              () => addPageUnder(r)),
      tinyBtn('\u270e', 'Rename this ' + (r.nopage ? 'group' : 'category'),
              () => renameCategory(r)),
      tinyBtn('\u2191', 'Move up (also reorders the site nav)',
              () => movePage(r.href, 'up'), i === 0 || !r.href),
      tinyBtn('\u2193', 'Move down (also reorders the site nav)',
              () => movePage(r.href, 'down'), i === rows.length - 1 || !r.href),
      tinyBtn('\u2212', r.nopage ? 'Remove this group heading' : 'Remove this category',
              () => removeCategory(r)),
    ];

    li.appendChild(treeRow({
      label: r.label,
      file: r.href || '',
      grip: children.length > 0,
      open: open,
      onToggle: () => {
        if (TREE_OPEN.has(r.slug)) TREE_OPEN.delete(r.slug);
        else TREE_OPEN.add(r.slug);
        saveTreeOpen();
        renderTree();
      },
      tools: tools,
    }));

    if (children.length) {
      const kids = document.createElement('ul');
      kids.className = 'kids';
      children.forEach((c, ci) => {
        const kli = document.createElement('li');
        // Sub-pages get the same tools as a category: rename, reorder within
        // the group, and delete (which moves the page to _trash).
        kli.appendChild(treeRow({
          label: c.label,
          file: c.href,
          tools: [
            tinyBtn('\u270e', 'Rename this page',
                    () => renameCategory({ slug: c.slug, label: c.label, nopage: false })),
            tinyBtn('\u2191', 'Move up inside ' + r.label,
                    () => moveChild(r, c, 'up'), ci === 0),
            tinyBtn('\u2193', 'Move down inside ' + r.label,
                    () => moveChild(r, c, 'down'), ci === children.length - 1),
            tinyBtn('\u2212', 'Delete this page (it moves to _trash)',
                    () => removeCategory({ slug: c.slug, label: c.label, nopage: false })),
          ],
        }));
        kids.appendChild(kli);
      });
      li.appendChild(kids);
    }
    tree.appendChild(li);
  });
}

async function loadState() {
  STATE = await get('/api/state');
  renderTree();
  showDefaultImage(STATE.defaultImage);

  setUndo(STATE.undoDepth);
}

async function selectPage(file) {
  CURRENT = file;
  document.querySelectorAll('#tree a').forEach(a =>
    a.classList.toggle('active', a.dataset.file === file));
  status('loading ' + file + '\u2026');
  const data = await get('/api/page?file=' + encodeURIComponent(file));
  CURRENT_DATA = data;
  document.getElementById('previewName').textContent = file;
  reloadPreview();
  status('');
}

async function move(file, sec, dir) {
  try {
    await post({ action: 'move_section', file, section: sec.file, dir });
    toast('Moved ' + (dir === 'up' ? 'up' : 'down'));
    await selectPage(file);
  } catch (e) { toast(e.message, true); }
}
async function drop(file, sec) {
  if (!confirm('Delete this section from the page?\n\nIt moves to _trash, so it can be recovered.')) return;
  try {
    await post({ action: 'drop_section', file, section: sec.file });
    toast('Section removed');
    await selectPage(file);
  } catch (e) { toast(e.message, true); }
}
async function dup(file, sec) {
  // Insert the copy directly after its source, so it lands where you expect.
  try {
    await post({ action: 'add_section', file, source: sec.file, after: sec.file });
    toast('Duplicated \u2014 edit its text, then Save section');
    await selectPage(file);
  } catch (e) { toast(e.message, true); }
}
async function addElement(file, template, label) {
  try {
    await post({ action: 'add_section', file, source: 'blank', template });
    toast(`Added ${label} at the bottom \u2014 move it with the arrows`);
    await selectPage(file);
  } catch (e) { toast(e.message, true); }
}
// --- block editing helpers ------------------------------------------------
// A paragraph is ONE editable box. Styling part of a line splits it into more
// spans on the server, but those stay in the box they came from, so nothing
// sprouts a new box of its own and you can see the styling as you set it.

function escHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// Text of a node (or fragment), counting a line break as one character so the
// offsets line up with how the box reads.
function nodeText(node) {
  let out = '';
  node.childNodes.forEach(c => {
    if (c.nodeType === 3) out += shownText(c);
    else if (c.nodeName === 'BR') out += brShows(c) ? '\n' : '';
    else out += nodeText(c);
  });
  return out;
}

// Does this <br> really start a new line? Firefox (and LibreWolf) slip
// invisible ones into text while you type; saved, they became real line
// breaks on the site. The preview page measures it (__mmIsBreak); a <br>
// outside the live page — a copy — is taken at its word.
function brShows(br) {
  try {
    const f = br.isConnected && br.ownerDocument.defaultView.__mmIsBreak;
    return f ? f(br) : true;
  } catch (e) { return true; }
}

// A text node as it reads: a newline character shows as a space unless the
// text keeps whitespace (pre / pre-wrap). Same length, so offsets still fit.
function shownText(t) {
  const v = t.nodeValue;
  if (!/[\r\n]/.test(v) || !t.isConnected || !t.parentElement) return v;
  const ws = t.ownerDocument.defaultView.getComputedStyle(t.parentElement).whiteSpace;
  return /^(pre|break-spaces)/.test(ws) ? v : v.replace(/[\r\n]/g, ' ');
}

function partsToHtml(parts) {
  return parts.map(p => {
    const text = escHtml(p.text || '').replace(/\n/g, '<br>');
    const style = (p.style || '').trim();
    const cls = escHtml(p.class || 'C9DxTc');
    const inner = style ? `<span class="${cls}" style="${escHtml(style)}">${text}</span>` : text;
    // A part with an href is a real link; the link colour and underline ride in
    // its style, set by the Link button.
    if ((p.href || '').trim()) {
      return `<a href="${escHtml(p.href.trim())}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
    }
    return inner;
  }).join('');
}

// Read the box back as parts: bare text with no styling, spans with their own,
// and links with their href.
function partsFromBox(box, fallbackClass) {
  const parts = [];
  box.childNodes.forEach(n => {
    if (n.nodeType === 3) {
      if (n.nodeValue) parts.push({ text: n.nodeValue, style: '', class: fallbackClass });
      return;
    }
    if (n.nodeType !== 1) return;
    if (n.nodeName === 'A') {
      const styled = n.querySelector('span');
      parts.push({
        text: nodeText(n),
        style: (styled ? styled.getAttribute('style') : n.getAttribute('style')) || '',
        class: (styled ? styled.getAttribute('class') : n.getAttribute('class')) || fallbackClass,
        href: n.getAttribute('href') || '',
      });
      return;
    }
    parts.push({
      text: nodeText(n),
      style: n.getAttribute('style') || '',
      class: n.getAttribute('class') || fallbackClass,
    });
  });
  return parts;
}

// Set or clear one declaration inside a style string.
function setCss(css, prop, value) {
  const keep = [];
  let found = false;
  String(css || '').split(';').forEach(decl => {
    if (!decl.includes(':')) return;
    const name = decl.split(':')[0].trim().toLowerCase();
    if (name === prop) {
      found = true;
      if (value) keep.push(`${prop}: ${value}`);
      return;
    }
    keep.push(decl.trim());
  });
  if (!found && value) keep.push(`${prop}: ${value}`);
  return keep.join('; ') + (keep.length ? ';' : '');
}

// Restyle just the [start, end) slice of the block's text, splitting parts as
// needed so only the selected words change.
function styleParts(parts, start, end, prop, value) {
  const out = [];
  let at = 0;
  for (const p of parts) {
    const text = p.text || '';
    const a = Math.max(start - at, 0);
    const b = Math.min(end - at, text.length);
    if (a >= b) {
      out.push(p);
    } else {
      if (a > 0) out.push({ text: text.slice(0, a), style: p.style, class: p.class });
      out.push({ text: text.slice(a, b), style: setCss(p.style, prop, value), class: p.class });
      if (b < text.length) out.push({ text: text.slice(b), style: p.style, class: p.class });
    }
    at += text.length;
  }
  return out;
}

// Where the caret/selection sits inside the box, as character offsets into the
// text the box shows. Null when there is no usable selection.
function boxSelection(box) {
  // ownerDocument, not document: in the preview the box lives inside the
  // iframe, which has its own selection and range objects.
  const doc = box.ownerDocument;
  const sel = doc.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (r.collapsed) return null;
  if (!box.contains(r.startContainer) || !box.contains(r.endContainer)) return null;
  // Counted over the live box, not a copy: only the live page can say which
  // line breaks show (brShows), and nodeText counts only those.
  return { start: liveOffset(box, r.startContainer, r.startOffset),
           end: liveOffset(box, r.endContainer, r.endOffset) };
}

function liveOffset(box, container, offset) {
  const doc = box.ownerDocument;
  const r = doc.createRange();
  r.selectNodeContents(box);
  try { r.setEnd(container, offset); } catch (e) { return nodeText(box).length; }
  const w = doc.createTreeWalker(box, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n = 0, x;
  while ((x = w.nextNode())) {
    if (x.nodeType === 3) {
      if (x === r.endContainer) { n += Math.min(r.endOffset, x.nodeValue.length); break; }
      if (r.comparePoint(x, x.nodeValue.length) !== 0) break;
      n += x.nodeValue.length;
    } else if (x.nodeName === 'BR') {
      const at = Array.prototype.indexOf.call(x.parentNode.childNodes, x) + 1;
      if (r.comparePoint(x.parentNode, at) !== 0) break;
      if (brShows(x)) n += 1;
    }
  }
  return n;
}


// Put the selection back over [start, end) after the box has been re-rendered,
// so you can chain colour then bold then size on the same words.
function selectRange(box, start, end) {
  // ownerDocument throughout: a box in the preview lives in the iframe, and a
  // range made by this document cannot hold that frame's nodes.
  const doc = box.ownerDocument;
  // Line breaks count as one character, as in nodeText — counting text nodes
  // alone restored the selection one letter early per break before it.
  const walker = doc.createTreeWalker(box, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let at = 0, from = null, to = null, n;
  while ((n = walker.nextNode())) {
    if (n.nodeType === 1) {
      if (n.nodeName === 'BR' && brShows(n)) at += 1;
      continue;
    }
    const len = n.nodeValue.length;
    if (!from && at + len >= start) from = { node: n, offset: Math.max(start - at, 0) };
    if (at + len >= end) { to = { node: n, offset: Math.max(end - at, 0) }; break; }
    at += len;
  }
  if (!from || !to) return;
  try {
    const r = doc.createRange();
    r.setStart(from.node, from.offset);
    r.setEnd(to.node, to.offset);
    const sel = doc.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  } catch (e) { /* box changed shape; leaving it unselected is fine */ }
}

// Turn [start, end) into a link (or, with an empty href, back into plain text).
// Splits parts as needed so only the selected words are affected.
function linkParts(parts, start, end, href) {
  const out = [];
  let at = 0;
  for (const p of parts) {
    const text = p.text || '';
    const a = Math.max(start - at, 0);
    const b = Math.min(end - at, text.length);
    if (a >= b) {
      out.push(p);
    } else {
      if (a > 0) out.push({ ...p, text: text.slice(0, a) });
      const mid = { ...p, text: text.slice(a, b) };
      if (href) {
        mid.href = href;
        // The site's own link blue, underlined, so it reads as clickable.
        mid.style = setCss(setCss(mid.style, 'color', '#4a86e8'), 'text-decoration', 'underline');
      } else {
        delete mid.href;
        mid.style = setCss(mid.style, 'text-decoration', '');
      }
      out.push(mid);
      if (b < text.length) out.push({ ...p, text: text.slice(b) });
    }
    at += text.length;
  }
  return out;
}

async function linkBlock(file, sec, blk, box, href, range) {
  const parts = partsFromBox(box, sec.spanClass || 'C9DxTc');
  if (!parts.length) return;
  const whole = parts.reduce((n, p) => n + (p.text || '').length, 0);
  const use = range || boxSelection(box) || { start: 0, end: whole };
  const next = linkParts(parts, use.start, use.end, href);
  box.innerHTML = partsToHtml(next);
  selectRange(box, use.start, use.end);
  await saveBlock(file, sec, blk, box, href ? 'Link added' : 'Link removed');
}

// Is every character in [start, end) of the box drawn bold? Line breaks count
// as one character, as in nodeText.
function looksBold(box, range) {
  if (!box || !range) return false;
  const win = box.ownerDocument.defaultView;
  const walker = box.ownerDocument.createTreeWalker(box, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let at = 0, n, touched = 0;
  while ((n = walker.nextNode())) {
    if (n.nodeType === 1) { if (n.nodeName === 'BR' && brShows(n)) at += 1; continue; }
    const len = n.nodeValue.length;
    if (at < range.end && at + len > range.start && n.nodeValue.trim()) {
      touched++;
      const w = win.getComputedStyle(n.parentElement).fontWeight;
      if ((parseInt(w, 10) || (w === 'bold' ? 700 : 400)) < 600) return false;
    }
    at += len;
  }
  return touched > 0;
}

// --- the styling bar ------------------------------------------------------
// ONE bar for the whole editor, at the top, like a word processor's, instead
// of one per section. It acts on whichever paragraph you are in and the words
// you have selected there; `active` records which box that is, set on focus.
let active = null;

function buildToolbar() {
  const PALETTE = ['#ffffff', '#434343', '#4a86e8', '#bf9000', '#ff0000'];
  const SIZES = [
    ['', 'size...'], ['10.6667pt', '10.7'], ['12pt', '12'],
    ['14pt', '14 (body)'], ['18pt', '18'], ['24pt', '24'],
    ['32pt', '32'], ['40pt', '40'],
  ];

  const tb = document.createElement('div');
  tb.className = 'tb';
  const sep = () => { const d = document.createElement('div'); d.className = 'tbsep'; return d; };

  // says what the bar will act on, so it is never a mystery
  const where = document.createElement('span');
  where.className = 'tblabel';
  where.textContent = 'style';

  // A button clicked in the preview: its label and link, edited as fields
  // rather than as text, because a button is a widget. Hidden until one is
  // clicked.
  const btnRow = document.createElement('span');
  btnRow.id = 'btnRow';
  btnRow.hidden = true;
  btnRow.style.cssText = 'display:inline-flex;gap:6px;align-items:center';

  const btnCap = document.createElement('span');
  btnCap.className = 'tblabel';
  btnCap.textContent = 'button';

  const btnLabel = document.createElement('input');
  btnLabel.className = 'btlabel';
  btnLabel.placeholder = 'button label';
  btnLabel.title = 'The text on the button';

  const btnHref = document.createElement('input');
  btnHref.className = 'bthref';
  btnHref.placeholder = 'button link';
  btnHref.title = 'Where the button goes';

  btnRow.append(btnCap, btnLabel, btnHref);
  ['change'].forEach(ev => btnLabel.addEventListener(ev, () => saveButtonField()));
  btnHref.addEventListener('change', () => saveButtonField());
  btnLabelInput = btnLabel;
  btnHrefInput = btnHref;

  tb.appendChild(btnRow);
  tb.appendChild(where);
  setInterval(() => {
    where.textContent = active && active.block
      ? `${(active.block.tag || 'text')} ${active.block.id}`
      : (active && active.sec ? 'section' : 'style');
  }, 400);

  const activeBox = () => {
    if (!active) { toast('Click into a paragraph first, then style it', true); return null; }
    if (!active.block) {
      toast('That is a section, not a paragraph \u2014 use the section buttons', true);
      return null;
    }
    return active;
  };

  // The section buttons act on whatever section is selected. That may be a
  // section with no paragraph in it at all — a spacer, an empty divider — which
  // is selected by clicking it directly, since there is no text to click.
  const secBox = () => {
    if (active && active.sec) return active;
    toast('Click a paragraph, or an empty section, first', true);
    return null;
  };

  const apply = (prop, value) => {
    const a = activeBox();
    if (a) styleBlock(a.file, a.sec, a.block, a.box, prop, value, a.range);
  };

  // What the selection covers, in the block's own text. The remembered range
  // is used first: pressing a control moves the selection before the handler
  // runs, so a live read there would style the wrong words.
  const covered = () => {
    if (!active) return null;
    const parts = partsFromBox(active.box, (active.sec && active.sec.spanClass) || 'C9DxTc');
    const whole = parts.reduce((n, p) => n + (p.text || '').length, 0);
    const live = active.range || boxSelection(active.box);
    return { parts, whole, range: live || { start: 0, end: whole } };
  };

  PALETTE.forEach(c => {
    const b = document.createElement('button');
    b.className = 'pal';
    b.style.background = c;
    b.title = 'Colour ' + c;
    b.onclick = () => apply('color', c);
    tb.appendChild(b);
  });

  const custom = document.createElement('input');
  custom.type = 'color';
  custom.className = 'pal';
  custom.value = '#ffffff';
  custom.title = 'Custom colour';
  custom.onchange = () => apply('color', custom.value);
  tb.appendChild(custom);

  const auto = document.createElement('button');
  auto.className = 'tiny';
  auto.textContent = 'auto';
  auto.title = 'Clear the colour so the text inherits the page default';
  auto.onclick = () => apply('color', '');
  tb.appendChild(auto);

  tb.appendChild(sep());

  // The URL box is separate from the words, so the flow is: select the words,
  // paste a URL, press link.
  const linkUrl = document.createElement('input');
  linkUrl.type = 'url';
  linkUrl.className = 'linkurl';
  linkUrl.placeholder = 'link url';
  linkUrl.title = 'The address to link the selected words to';
  tb.appendChild(linkUrl);

  const linkBtn = document.createElement('button');
  linkBtn.className = 'tiny';
  linkBtn.textContent = 'link';
  linkBtn.title = 'Make the selected words a link (opens in a new tab)';
  linkBtn.onclick = () => {
    const a = activeBox(); if (!a) return;
    const url = (linkUrl.value || '').trim();
    if (!url) { toast('Paste a URL in the link box first', true); return; }
    linkBlock(a.file, a.sec, a.block, a.box, url, a.range);
  };
  tb.appendChild(linkBtn);

  const unlinkBtn = document.createElement('button');
  unlinkBtn.className = 'tiny';
  unlinkBtn.textContent = 'unlink';
  unlinkBtn.title = 'Remove the link from the selected words';
  unlinkBtn.onclick = () => {
    const a = activeBox(); if (!a) return;
    linkBlock(a.file, a.sec, a.block, a.box, '', a.range);
  };
  tb.appendChild(unlinkBtn);

  tb.appendChild(sep());

  const boldBtn = document.createElement('button');
  boldBtn.className = 'tiny';
  boldBtn.textContent = 'B';
  boldBtn.style.fontWeight = '700';
  boldBtn.title = 'Bold the selected words (click again to unbold)';
  boldBtn.onclick = () => {
    const c = covered(); if (!c) return;
    // A toggle, like any rich text editor: if everything the selection covers
    // already LOOKS bold, this click makes it normal weight instead.
    //
    // Judged by how the text is drawn, not by its own style: a heading is
    // bold from the site's stylesheet with no font-weight of its own, so the
    // old check called it "not bold", the click set bold (no visible change),
    // and the next click only removed that again — it could never be unbolded.
    // For the same reason "off" is an explicit 400, which beats the heading's.
    apply('font-weight', looksBold(active.box, c.range) ? '400' : '700');
  };
  tb.appendChild(boldBtn);

  // Bullets on / off for the paragraph you are in. It works on any paragraph,
  // the site's own included: a paragraph becomes a bullet (joining a list
  // right beside it), a bullet becomes a paragraph again.
  const listBtn = document.createElement('button');
  listBtn.className = 'tiny';
  listBtn.textContent = '\u2022 list';
  listBtn.title = 'Bullet point on / off for this paragraph (then Shift+Enter adds the next bullet)';
  listBtn.onclick = () => {
    const a = activeBox(); if (!a) return;
    toggleBullet(a);
  };
  tb.appendChild(listBtn);
  setInterval(() => {
    const inList = !!(active && active.box && active.box.isConnected && active.box.closest('li'));
    listBtn.classList.toggle('on', inList);
  }, 400);

  tb.appendChild(sep());

  const sizeSel = document.createElement('select');
  sizeSel.title = 'Text size for the selected words (or the whole paragraph)';
  SIZES.forEach(([value, text]) => {
    const o = document.createElement('option');
    o.value = value;
    o.textContent = text;
    sizeSel.appendChild(o);
  });
  // A <select> fires change only when the value actually differs, so choosing 12
  // for one paragraph and then 12 for another did nothing the second time. This
  // is a menu of sizes, not a display of the current one — it was never synced
  // to the block — so it clears itself after each use and every pick counts.
  //
  // Clearing on mousedown seemed right but the click that picks an option also
  // mousedowns the select in some browsers, so the value was already empty by
  // the time change ran and nothing was ever applied. Clearing after applying
  // has no such race.
  sizeSel.onchange = () => {
    const v = sizeSel.value;
    sizeSel.value = '';
    if (!v) return;
    const a = activeBox(); if (!a) return;
    apply('font-size', v);
  };
  tb.appendChild(sizeSel);

  const hint = document.createElement('span');
  hint.className = 'tbhint';
  hint.textContent = 'select words, then style \u00b7 Enter = new line \u00b7 Shift+Enter = next bullet';
  tb.appendChild(hint);

  // --- the section this paragraph is in ------------------------------------
  tb.appendChild(sep());

  // Put them in order too: the cards had up/down and the bar should not be a
  // step backwards from them.
  const upBtn = document.createElement('button');
  upBtn.className = 'tiny';
  upBtn.textContent = '\u2191';
  upBtn.title = 'Move this paragraph\u2019s section earlier on the page';
  upBtn.onclick = () => {
    const a = secBox(); if (!a) return;
    move(a.file, a.sec, 'up');
  };
  tb.appendChild(upBtn);

  const downBtn = document.createElement('button');
  downBtn.className = 'tiny';
  downBtn.textContent = '\u2193';
  downBtn.title = 'Move this paragraph\u2019s section later on the page';
  downBtn.onclick = () => {
    const a = secBox(); if (!a) return;
    move(a.file, a.sec, 'down');
  };
  tb.appendChild(downBtn);

  const dupBtn = document.createElement('button');
  dupBtn.className = 'tiny';
  dupBtn.textContent = 'duplicate';
  dupBtn.title = 'Copy the whole section this paragraph is in';
  dupBtn.onclick = () => {
    const a = secBox(); if (!a) return;
    dup(a.file, a.sec);
  };
  tb.appendChild(dupBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'tiny danger';
  delBtn.textContent = 'delete';
  delBtn.title = 'Delete this paragraph\u2019s section (it goes to _trash, so it can be recovered)';
  delBtn.onclick = () => {
    const a = secBox(); if (!a) return;
    drop(a.file, a.sec);
  };
  tb.appendChild(delBtn);

  // --- Add element, in the bar with everything else ------------------------
  // It used to sit above the section list, rebuilt for every page. It adds to
  // the bottom of whichever page is open.
  tb.appendChild(sep());

  const addWrap = document.createElement('div');
  addWrap.style.cssText = 'position:relative;display:inline-flex';

  const addBtn = document.createElement('button');
  addBtn.className = 'tiny';
  addBtn.textContent = '+ element \u25be';
  addBtn.title = 'Add an element to the bottom of the page you are editing';

  const menu = document.createElement('div');
  menu.className = 'elmenu';
  menu.hidden = true;

  // Filled when the menu opens, not at mount: the bar is built before the
  // page state arrives, so STATE.templates is still empty at that point and
  // the menu would permanently say "no templates".
  const fillMenu = () => {
    menu.innerHTML = '';
    const templates = STATE.templates || [];
    if (templates.length) {
      for (const t of templates) {
        const item = document.createElement('button');
        item.textContent = t.label;
        item.onclick = () => {
          menu.hidden = true;
          if (!CURRENT) { toast('Pick a page on the left first', true); return; }
          addElement(CURRENT, t.file, t.label);
        };
        menu.appendChild(item);
      }
    } else {
      const item = document.createElement('button');
      item.textContent = 'no templates \u2014 run make_templates.py';
      item.disabled = true;
      menu.appendChild(item);
    }
  };

  addBtn.onclick = (ev) => {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
    if (!menu.hidden) fillMenu();
  };
  addWrap.append(addBtn, menu);
  tb.appendChild(addWrap);

  // Keep the paragraph's focus and selection when a control is pressed. Without
  // this the mousedown blurs the box, the selection is lost, and a colour lands
  // on the whole paragraph instead of the words you picked. The colour picker
  // and the size list need real mouse events, so they are let through.
  tb.addEventListener('mousedown', e => {
    if (e.target.closest('select, input')) return;
    e.preventDefault();
  });
  return tb;
}

// --- editing inside the preview -------------------------------------------
// The preview is the real page, served with each editable block marked
// "section:block". The script in there reports clicks and edits; this side owns
// the saving, so there is still only one place that knows how to write a block
// back.
let CURRENT_DATA = null;

// The button clicked in the preview, and the two fields that edit it. The row
// lives in the bar, built once, so these are filled in from here.
let BTN = null;
let btnLabelInput = null;
let btnHrefInput = null;

// A file input, created once, used for whichever image was clicked.
let imgFile = null;
let IMG = null;

function showImageSwap(target) {
  const m = /^(\d+):(\d+)$/.exec(String(target || ''));
  if (!m || !CURRENT_DATA) return;
  const sec = (CURRENT_DATA.sections || [])[Number(m[1])];
  const img = sec && (sec.images || [])[Number(m[2])];
  if (!img) return;
  IMG = { sec, img };
  if (!imgFile) {
    imgFile = document.createElement('input');
    imgFile.type = 'file';
    imgFile.accept = 'image/*';
    imgFile.hidden = true;
    imgFile.onchange = () => swapPreviewImage(imgFile.files[0]);
    document.body.appendChild(imgFile);
  }
  status('Pick an image to swap in');
  imgFile.value = '';
  imgFile.click();
}

async function swapPreviewImage(blob) {
  if (!blob || !IMG) return;
  if (!/^image\//.test(blob.type)) { toast('That file is not an image', true); return; }
  try {
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('could not read that file'));
      reader.readAsDataURL(blob);
    });
    const up = await post({ action: 'upload_image', name: blob.name, data });
    await post({ action: 'set_image', file: CURRENT, section: IMG.sec.file,
                 index: IMG.img.i, src: up.src });
    toast('Image swapped');
    status('saved ' + new Date().toLocaleTimeString());
    reloadPreview();
  } catch (e) { toast(e.message, true); status('swap failed'); }
}

function showButtonFields(target) {
  const m = /^(\d+):(\d+)$/.exec(String(target || ''));
  const row = document.getElementById('btnRow');
  if (!m || !CURRENT_DATA || !row) { if (row) row.hidden = true; return; }
  const sec = (CURRENT_DATA.sections || [])[Number(m[1])];
  const btn = sec && (sec.buttons || [])[Number(m[2])];
  if (!btn) { row.hidden = true; return; }
  BTN = { k: Number(m[2]), sec };
  row.hidden = false;
  if (btnLabelInput) btnLabelInput.value = btn.label || '';
  if (btnHrefInput) btnHrefInput.value = btn.href || '';
}

async function saveButtonField() {
  if (!BTN || !btnLabelInput || !btnHrefInput) return;
  // The whole list goes back: the server understands buttons as a list, and the
  // untouched entries carry their styling through unchanged.
  const list = (BTN.sec.buttons || []).map((b, i) => i === BTN.k
    ? { label: btnLabelInput.value, href: btnHrefInput.value,
        background: b.background, colour: b.colour, size: b.size }
    : { label: b.label, href: b.href,
        background: b.background, colour: b.colour, size: b.size });
  try {
    status('saving\u2026');
    await post({ action: 'set_buttons', file: CURRENT, section: BTN.sec.file, buttons: list });
    status('saved ' + new Date().toLocaleTimeString());
    reloadPreview();
  } catch (e) { toast(e.message, true); status('save failed'); }
}

// The blocks the editor actually offers for a section, in the same order the
// server numbered them. Must stay in step with both the card filter and the
// annotation, or an edit lands on a neighbouring paragraph.
function editablesOf(sec) {
  const runs = sec.runs || [];
  return (sec.blocks || []).filter(b =>
    (b.runs || []).some(i => runs[i] && runs[i].editable !== false));
}

function blockFromTarget(target) {
  if (!CURRENT_DATA || !target) return null;
  // "0:3+1" is a bullet added in the page and not saved yet: it resolves to
  // the block it was split from ("0:3"), which locates its list, but it has no
  // block of its own on the server — `provisional` says so.
  const m = /^(\d+):(\d+)(\+\d+)?$/.exec(String(target));
  if (!m) return null;
  const sec = (CURRENT_DATA.sections || [])[Number(m[1])];
  if (!sec) return null;
  const blk = editablesOf(sec)[Number(m[2])];
  if (!blk) return null;
  return { sec, block: blk, provisional: !!m[3] };
}

// --- lists -------------------------------------------------------------------
// A list whose shape changed in the preview (Shift+Enter, Tab, Shift+Tab,
// Backspace) is marked data-mm-list="dirty" there and saved as a whole tree.

function outermostList(el) {
  let root = null;
  for (let n = el; n; n = n.parentElement) if (n.tagName === 'UL' || n.tagName === 'OL') root = n;
  return root;
}

function dirtyListOf(el) {
  const root = el && el.isConnected ? outermostList(el) : null;
  return root && root.getAttribute('data-mm-list') === 'dirty' ? root : null;
}

function dirtyLists() {
  try {
    const d = document.getElementById('preview').contentDocument;
    return d ? [...d.querySelectorAll('[data-mm-list="dirty"]')] : [];
  } catch (e) { return []; }
}

function listItemsOf(listEl, spanClass) {
  const items = [];
  [...listEl.children].forEach(li => {
    if (li.tagName !== 'LI') return;
    let body = [...li.children].find(c => c.tagName === 'P');
    if (!body) {
      body = li.cloneNode(true);
      body.querySelectorAll('ul, ol').forEach(x => x.remove());
    }
    const parts = partsFromBox(body, spanClass)
      .map(p => ({ ...p, text: (p.text || '').split('\u200b').join('') }))
      .filter(p => p.text);
    const sub = [...li.children].find(c => c.tagName === 'UL' || c.tagName === 'OL');
    items.push({ parts, children: sub ? listItemsOf(sub, spanClass) : [] });
  });
  return items;
}

async function saveList(root, reload = true) {
  // Any bullet that was already there locates the list on the server.
  const anchor = [...root.querySelectorAll('[data-mmb]')]
    .find(el => !el.getAttribute('data-mmb').includes('+'));
  const hit = anchor && blockFromTarget(anchor.getAttribute('data-mmb'));
  if (!hit) { toast('Could not find this list to save it \u2014 reload the preview', true); return; }
  root.removeAttribute('data-mm-list');
  const spanClass = hit.sec.spanClass || 'C9DxTc';
  try {
    status('saving list\u2026');
    await post({ action: 'set_list', file: CURRENT, section: hit.sec.file,
                 block: hit.block.id, spanClass, items: listItemsOf(root, spanClass) });
    status('saved ' + new Date().toLocaleTimeString());
  } catch (e) { toast(e.message, true); status('list save failed'); }
  if (reload) reloadPreview();
}

// Has the paragraph been typed into since the page was loaded? Compared with
// the text the server has for that block.
function boxChanged(a) {
  const server = (a.block.runs || []).map(i => (a.sec.runs[i] || {}).raw || '').join('');
  return nodeText(a.box).split('\u200b').join('') !== server;
}

async function toggleBullet(a) {
  if (!a.box || !a.box.isConnected) {
    toast('Click into the paragraph again, then press \u2022 list', true);
    return;
  }
  // A list changed in the page is numbered differently on the server until it
  // is saved, so save it first and have the paragraph picked again.
  if (a.provisional || dirtyListOf(a.box)) {
    await flushLists();
    reloadPreview();
    toast('List saved \u2014 click the paragraph again, then press \u2022 list', true);
    return;
  }
  try {
    // Unsaved typing goes in first, or the toggle would rebuild the old text.
    if (boxChanged(a)) {
      await post({ action: 'set_block', file: a.file, section: a.sec.file, block: a.block.id,
                   spanClass: a.sec.spanClass, parts: partsFromBox(a.box, a.sec.spanClass || 'C9DxTc') });
    }
    const r = await post({ action: 'toggle_list', file: a.file, section: a.sec.file, block: a.block.id });
    toast(r.did === 'bullet on' ? 'Bullet on \u2014 Shift+Enter adds the next one' : 'Bullet off');
    status('saved ' + new Date().toLocaleTimeString());
    reloadPreview();
  } catch (e) { toast(e.message, true); }
}

async function flushLists() {
  for (const root of dirtyLists()) await saveList(root, false);
}

// The section a "section:index" target belongs to, for widgets that are not
// blocks — buttons and images — so their section can still be selected.
function sectionAt(target) {
  if (!CURRENT_DATA || !target) return null;
  const m = /^(\d+):/.exec(String(target));
  if (!m) return null;
  return (CURRENT_DATA.sections || [])[Number(m[1])] || null;
}

function previewEl(target) {
  const doc = document.getElementById('preview').contentDocument;
  return doc ? doc.querySelector('[data-mmb="' + target + '"]') : null;
}

async function savePostedBlock(hit, html) {
  // An unsaved bullet has no block of its own yet; its list saves it.
  if (hit.provisional) return;
  // The served markup carries the editor's own attributes; strip them before
  // reading the block back as parts.
  const tmp = document.createElement('div');
  tmp.innerHTML = String(html || '');
  tmp.querySelectorAll('[data-mmb]').forEach(el => {
    el.removeAttribute('data-mmb');
    el.removeAttribute('contenteditable');
  });
  const parts = partsFromBox(tmp, (hit.sec && hit.sec.spanClass) || 'C9DxTc');
  if (!parts.length) return;
  try {
    status('saving\u2026');
    await post({ action: 'set_block', file: CURRENT, section: hit.sec.file,
                 block: hit.block.id, spanClass: hit.sec.spanClass, parts });
    status('saved ' + new Date().toLocaleTimeString());
  } catch (e) { toast(e.message, true); status('save failed'); }
}

window.addEventListener('message', ev => {
// Only the preview frame may drive the editor. Any other window that can
// reach this one — a page that opened it, say — could otherwise post a
// "change" and have it saved.
const frame = document.getElementById('preview');
if (!frame || ev.source !== frame.contentWindow) return;
const d = ev.data || {};
if (!d.mm) return;
// The page reports what it managed to make editable. Surfacing it means the
// edit mode is never a mystery: either it says how many blocks are editable,
// or it says none are, and you know which side to look at.
if (d.mm === 'ready') {
  clearTimeout(previewWait);
  const n = Number(d.matched) || 0;
  const expected = Number(d.expected) || 0;
  let query = '';
  try { query = document.getElementById('preview').contentWindow.location.search || ''; }
  catch (e) { query = '(unreadable)'; }
  const flag = query.includes('mm_edit') ? 'edit mode' : 'NO EDIT FLAG';
  if (expected && !n) {
    warn('<b>The page came back without edit markers.</b> The preview requested '
         + (flag === 'edit mode' ? 'edit mode' : 'no flag (stale tab — reload with Ctrl+Shift+R)')
         + ', and marked none of its ' + expected + ' blocks.');
    status(`NOT EDITABLE \u2014 no markers (${flag})`);
  } else if (!expected) {
    warn('');
    status('nothing editable on this page');
  } else {
    warn('');
    status(`${n} of ${expected} blocks editable (${flag}) \u00b7 click a paragraph`);
  }
  return;
}
if (d.mm === 'button') {
  // Selecting a button must also select the section it sits in, or the section
  // buttons have nothing to act on — which is why a section made only of buttons
  // (a leftover row of links, say) could not be removed at all.
  const bSec = sectionAt(d.target);
  if (bSec) active = { file: CURRENT, sec: bSec, block: null, box: null, range: null };
  showButtonFields(d.target);
  return;
}
if (d.mm === 'image') {
  const iSec = sectionAt(d.target);
  if (iSec) active = { file: CURRENT, sec: iSec, block: null, box: null, range: null };
  showImageSwap(d.target);
  return;
}
// A section clicked with nothing editable inside it — a spacer, an empty
// divider. There is no block to act on, so the section itself becomes the
// selection and the section buttons (↑ ↓ duplicate delete) work on it.
if (d.mm === 'section') {
  const si = Number(d.target);
  // CURRENT_DATA is the same structure blockFromTarget reads; STATE has no
  // sections, which is why this said "could not find that section".
  const secs = (CURRENT_DATA && CURRENT_DATA.sections) || [];
  const s = secs[si];
  if (!s) { toast('Could not find that section', true); return; }
  active = { file: CURRENT, sec: s, block: null, box: null, range: null };
  toast('Section selected (spacer) \u2014 use \u2191 \u2193 duplicate delete');
  return;
}
// A link clicked in the preview opens in a tab instead of navigating the
// editing view out from under you.
// A changed list was left: save it whole.
if (d.mm === 'list') {
  const el = previewEl(d.target);
  const root = el && outermostList(el);
  if (root) saveList(root);
  return;
}
if (d.mm === 'list-dirty') {
  status('list changed \u2014 it saves when you click outside it');
  return;
}
if (d.mm === 'open') {
  // Web addresses only: a javascript: link in the page must not run here.
  let url = null;
  try { url = new URL(String(d.href || ''), frame.contentWindow.location.href); } catch (e) {}
  if (url && /^https?:$/.test(url.protocol)) window.open(url.href, '_blank', 'noopener,noreferrer');
  return;
}
const hit = blockFromTarget(d.target);
  if (!hit) return;
  const box = previewEl(d.target);

  if (d.mm === 'focus') {
    active = { file: CURRENT, sec: hit.sec, block: hit.block, provisional: hit.provisional, box, range: null };
    return;
  }
  if (d.mm === 'sel') {
    // A selection inside the preview, as character offsets, so the bar can
    // style the words you picked rather than the whole paragraph.
    active = { file: CURRENT, sec: hit.sec, block: hit.block, provisional: hit.provisional, box,
               range: { start: Number(d.start) || 0, end: Number(d.end) || 0 } };
    return;
  }
  if (d.mm === 'change') {
    active = { file: CURRENT, sec: hit.sec, block: hit.block, provisional: hit.provisional, box, range: null };
    savePostedBlock(hit, d.html);
    return;
  }
  if (d.mm === 'move') {
    active = { file: CURRENT, sec: hit.sec, block: hit.block, provisional: hit.provisional, box, range: null };
    movePostedBlock(hit, d.left, d.top, d.width);
  }
});

async function movePostedBlock(hit, left, top, width) {
  if (hit.provisional) {
    toast('Click outside the list to save it first, then move it', true);
    reloadPreview();
    return;
  }
  try {
    status('moving\u2026');
    await post({ action: 'set_free', file: CURRENT, section: hit.sec.file,
                 block: hit.block.id, left, top, width });
    // A placed block keeps its spot on wide screens; on a phone the site
    // puts it back in line with the rest of the page (sitekit, data-mmfree).
    toast('Moved \u2014 on phones it goes back in line with the rest of the page');
    status('saved ' + new Date().toLocaleTimeString());
    reloadPreview();
  } catch (e) { toast(e.message, true); status('move failed'); }
}

// The bar belongs to the chrome, not to a section, so it is built once.
(function mountToolbar() {
  const mount = () => {
    const host = document.getElementById('topbar');
    if (host) host.appendChild(buildToolbar());
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();

async function styleBlock(file, sec, blk, box, prop, value, range) {
  const parts = partsFromBox(box, sec.spanClass || 'C9DxTc');
  if (!parts.length) return;
  const whole = parts.reduce((n, p) => n + (p.text || '').length, 0);
  // Callers that worked out the range already pass it in, so the decision they
  // made and the slice styled here cannot drift apart.
  // The live selection wins; a caller may pass the range it already worked out,
  // and the remembered one is the last resort.
  const use = range || boxSelection(box) || { start: 0, end: whole };
  const next = styleParts(parts, use.start, use.end, prop, value);
  box.innerHTML = partsToHtml(next);
  // Re-rendering destroys the old nodes and the selection with them. Restore it
  // over the same words, ignoring the select event that restore causes.
  // NOTE: no `active` here — this function is module scope, `active` belongs to
  // the per-section closure, and touching it threw a ReferenceError that
  // silently skipped the save.
  selectRange(box, use.start, use.end);
  await saveBlock(file, sec, blk, box,
                  use.end - use.start < whole
                    ? 'Style applied to the selected text'
                    : 'Style updated');
}

async function saveBlock(file, sec, blk, box, message, quiet) {
  // Inside a list whose shape changed, the whole list saves instead: its
  // blocks are numbered differently on the server until it does.
  const root = dirtyListOf(box);
  if (root) {
    await saveList(root);
    if (message) toast(message);
    return;
  }
  if (!box || !box.isConnected || (active && active.provisional && active.box === box)) {
    toast('Click into the paragraph again, then try that once more', true);
    return;
  }
  const parts = partsFromBox(box, sec.spanClass || 'C9DxTc');
  if (!parts.length) return;
  try {
    // A quiet save is the one that happens while you type: it says so in the
    // status line but does not reload the preview, which would flash the pane
    // on every pause in typing.
    status(quiet ? 'saving\u2026' : '');
    await post({ action: 'set_block', file, section: sec.file, block: blk.id,
                 spanClass: sec.spanClass, parts });
    if (message) toast(message);
    status('saved ' + new Date().toLocaleTimeString());
    if (!quiet) reloadPreview();
  } catch (e) { toast(e.message, true); status('save failed'); }
}

// --- the default image for new Image elements ------------------------------
// This changes the element templates, not a page: every Image element added
// from now on starts from this picture. Existing images are untouched.
function showDefaultImage(src) {
  const thumb = document.getElementById('defThumb');
  if (!thumb) return;
  thumb.src = src || '';
  thumb.style.display = src ? '' : 'none';
}

async function setDefaultImage(blob) {
  if (!blob) return;
  if (!/^image\//.test(blob.type)) { toast('That file is not an image', true); return; }
  try {
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('could not read that file'));
      reader.readAsDataURL(blob);
    });
    const up = await post({ action: 'upload_image', name: blob.name, data });
    await post({ action: 'set_default_image', src: up.src });
    showDefaultImage(up.src);
    const size = up.bytes < 1024 ? `${up.bytes} bytes`
                                 : `${Math.round(up.bytes / 1024)} KB`;
    toast(`New Image elements will start with ${up.name} (${size})`
          + (up.reused ? ' — already uploaded, so no new copy' : ''));
  } catch (e) { toast(e.message, true); }
}

(function wireDefaultImage() {
  const mount = () => {
    const pick = document.getElementById('defPick');
    const file = document.getElementById('defFile');
    if (!pick || !file) return;
    pick.onclick = () => file.click();
    file.onchange = () => setDefaultImage(file.files[0]);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();

// Close any open Add-element menu when clicking elsewhere.
document.addEventListener('click', () => {
  document.querySelectorAll('.elmenu').forEach(m => { m.hidden = true; });
});
async function movePage(file, dir) {
  try {
    await post({ action: 'move_page', file, dir });
    await loadState();
    if (CURRENT) await selectPage(CURRENT);
    toast('Reordered \u2014 nav updated on every page');
  } catch (e) { toast(e.message, true); }
}

document.getElementById('undo').onclick = async () => {
  try {
    const r = await post({ action: 'undo' });
    toast('Undid: ' + r.undid);
    await loadState();
    if (CURRENT && STATE.pages.some(p => p.file === CURRENT)) await selectPage(CURRENT);
    else { CURRENT = null; reloadPreview(); }
  } catch (e) { toast(e.message, true); }
};

document.getElementById('addPage').onclick = async () => {
  const input = document.getElementById('newPage');
  const label = input.value.trim();
  if (!label) return;
  const slug = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  try {
    const r = await post({ action: 'add_page', slug, label });
    input.value = '';
    toast('Added page ' + label);
    await loadState();
    await selectPage(r.page);
  } catch (e) { toast(e.message, true); }
};
document.getElementById('newPage').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addPage').click();
});

document.getElementById('addGroup').onclick = async () => {
  const input = document.getElementById('newGroup');
  const label = input.value.trim();
  if (!label) return;
  const slug = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  try {
    await post({ action: 'add_group', slug, label });
    input.value = '';
    toast('Added group "' + label + '" \u2014 a nav heading with no page');
    await loadState();
  } catch (e) { toast(e.message, true); }
};
document.getElementById('newGroup').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addGroup').click();
});
document.getElementById('reloadPreview').onclick = reloadPreview;
document.getElementById('openSite').onclick = () => window.open('index.html', '_blank');

// --- full screen -----------------------------------------------------------
const previewPane = document.getElementById('previewPane');
const fsBtn = document.getElementById('fullscreen');

function setFullscreenUI(on) {
  document.body.classList.toggle('fs', on);
  previewPane.style.display = on ? 'flex' : '';
  fsBtn.textContent = on ? 'Exit full screen' : 'Full screen';
  if (on) reloadPreview();
}

fsBtn.onclick = async () => {
  const goingFull = !document.body.classList.contains('fs');
  setFullscreenUI(goingFull);
  try {
    if (goingFull) await previewPane.requestFullscreen();
    else if (document.fullscreenElement) await document.exitFullscreen();
  } catch (err) {
    // Fullscreen API blocked or unsupported — the layout toggle still applies.
    toast(goingFull ? 'Full screen layout \u2014 press Esc to exit' : 'Exited full screen');
  }
};

// Esc (or F11) leaves the native fullscreen; mirror that back into the layout.
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('fs')) {
    setFullscreenUI(false);
  }
});

// --- publish ---------------------------------------------------------------
// One button for "save my changes to GitHub". The server runs the git steps
// (tools/publish.py); this panel says what will happen and what did.
let PUB = null;
let pubBusy = false;
let pubResult = null;
// The note being typed, kept outside the panel: the panel redraws itself
// (every 30 seconds, to keep the count current) and that wiped the box.
let pubNoteText = '';
const pubBtn = document.getElementById('publish');
const pubPanel = document.getElementById('pubPanel');

function escText(s) { return escHtml(String(s == null ? '' : s)); }

async function pubRefresh() {
  try { PUB = await post({ action: 'git_status' }); }
  catch (e) { PUB = { ready: false, problem: e.message }; }
  const n = PUB && PUB.ready ? (PUB.pages.length || PUB.changed) : 0;
  pubBtn.textContent = n ? `Publish (${n})` : (PUB && PUB.ready && PUB.ahead ? 'Publish (1)' : 'Publish');
  pubBtn.title = n ? `Unpublished changes on ${n} page${n === 1 ? '' : 's'}` : 'Upload your changes to GitHub';
  if (!pubPanel.hidden) pubRender();
}

function pubRender() {
  const body = document.getElementById('pubBody');
  const P = PUB || {};
  let html = '';
  if (!PUB) {
    html = '<p class="muted">Checking\u2026</p>';
  } else if (!P.ready) {
    html = `<p>${escText(P.problem)}</p>`;
  } else {
    if (P.live) {
      html += `<p class="muted">Publishing updates the live site (branch <b>${escText(P.branch)}</b>).</p>`;
    } else {
      html += `<div class="warnbox">You are on the test branch <b>${escText(P.branch)}</b>. Publishing
        uploads to that branch; it goes live once it is merged into main on GitHub.
        <div class="row" style="margin:8px 0 0"><button class="tiny" id="pubMain" ${P.changed ? 'disabled title="Publish your changes first"' : ''}>Switch to main</button></div></div>`;
    }
    if (P.changed) {
      html += '<p>Unpublished changes:</p><ul>' +
        (P.pages.length ? P.pages.map(f => ((STATE.pages || []).find(x => x.file === f) || {}).title || f)
                        : [`${P.changed} file${P.changed === 1 ? '' : 's'}`])
          .map(x => `<li>${escText(x)}</li>`).join('') + '</ul>';
      html += '<textarea id="pubNote" rows="3" placeholder="What did you change? (optional \u2014 any length)"></textarea>';
    } else if (P.ahead) {
      html += '<p>Saved changes are waiting to be uploaded.</p>';
    } else {
      html += '<p class="muted">No unpublished changes.</p>';
    }
    html += `<div class="row">
      <button class="primary" id="pubGo" ${pubBusy ? 'disabled' : ''}>${pubBusy === 'publish' ? 'Publishing\u2026' : 'Publish to site'}</button>
      <button id="pubPull" ${pubBusy ? 'disabled' : ''}>${pubBusy === 'pull' ? 'Getting latest\u2026' : 'Get latest from GitHub'}</button>
    </div>`;
    if (P.repo) html += `<p class="muted" style="margin:6px 0 0"><a href="${escText(P.repo)}" target="_blank" rel="noopener">Open the repository on GitHub</a></p>`;
  }
  if (pubResult) html += `<div class="result ${pubResult.ok ? 'good' : 'bad'}">${escText(pubResult.text)}</div>`;
  body.innerHTML = html;
  const noteBox = document.getElementById('pubNote');
  if (noteBox) {
    noteBox.value = pubNoteText;
    noteBox.oninput = () => { pubNoteText = noteBox.value; };
  }
  const go = document.getElementById('pubGo');
  if (go) go.onclick = () => pubRun('publish');
  const pull = document.getElementById('pubPull');
  if (pull) pull.onclick = () => pubRun('pull');
  const toMain = document.getElementById('pubMain');
  if (toMain) toMain.onclick = () => pubRun('main');
}

async function pubRun(kind) {
  if (pubBusy) return;
  const note = pubNoteText;
  pubBusy = kind;
  pubResult = null;
  pubRender();
  try {
    // A list changed in the preview is saved before anything is uploaded.
    await flushLists();
    const action = kind === 'publish' ? 'publish' : kind === 'pull' ? 'git_update' : 'git_main';
    const r = await post({ action, note });
    if (kind === 'publish' && r.did === 'published') pubNoteText = '';
    pubResult = { ok: true, text: r.message + (r.undoCleared ? ' (Undo history was cleared, since the files changed.)' : '') };
    if (r.pulled || r.reload) {
      await loadState();
      if (CURRENT && STATE.pages.some(p => p.file === CURRENT)) await selectPage(CURRENT);
      else { CURRENT = null; reloadPreview(); }
    }
  } catch (e) {
    pubResult = { ok: false, text: e.message };
  }
  pubBusy = false;
  await pubRefresh();
  pubRender();
}

pubBtn.onclick = () => {
  pubPanel.hidden = !pubPanel.hidden;
  if (!pubPanel.hidden) { pubResult = null; pubRender(); pubRefresh(); }
};
document.getElementById('pubClose').onclick = () => { pubPanel.hidden = true; };
// Keep the count on the button roughly current.
setInterval(() => {
  // Never redraw under someone typing their note.
  const typing = document.activeElement && document.activeElement.id === 'pubNote';
  if (!pubBusy && !typing) pubRefresh();
}, 30000);

loadState().catch(e => toast(e.message, true));
pubRefresh();
</script>
